# إعداد نشر تلقائي على Render — https://render.com
# الخطوات: New + → Blueprint → اختر مستودع Adaa-dashboard/dashboard وفرع main → Apply
#
# مهم: كل المتغيّرات هنا بـ sync:false — أي أن Render لا يكتب قيمها من هذا الملف،
# بل يبقيها كما هي في لوحة الخدمة (أو يسألك عنها مرة واحدة عند الإنشاء).
# هذا يحمي DATABASE_URL ورقم جوال المدير من أن يُدهسا بقيم افتراضية عند أي مزامنة.
services:
  - type: web
    name: perf-dashboard
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      # رابط قاعدة Neon — يُدخَل في لوحة Render فقط، ولا يُكتب في المستودع أبداً
      - key: DATABASE_URL
        sync: false
      # رقم جوال مدير الإدارة (سجّلي الدخول به — الرمز يظهر على الشاشة بلا مزوّد SMS)
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_NAME
        sync: false
      # الموقع يعمل عبر HTTPS على Render
      - key: COOKIE_SECURE
        sync: false
      # النسخة النهائية: بدون بيانات تجريبية
      - key: SEED_DEMO
        sync: false
