:root{
  --g-900:#003b33;--g-800:#00584c;--g-700:#016b5f;--g-600:#008b84;--g-500:#3ba295;--g-400:#5aaba2;
  --g-100:#d6e6e3;--g-50:#eef6f4;--gold:#e0a200;--emerald:#00b288;--amber:#e0971a;--red:#d34a4a;--green:#1a9d5c;
  --ink:#132420;--ink-2:#4b5a55;--muted:#8a9a95;--line:#e6efec;--card:#fff;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:"Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;direction:rtl;color:var(--ink);
  background:radial-gradient(1200px 600px at 82% -5%,rgba(255,255,255,.10),transparent),linear-gradient(135deg,#0c5f54,#063f39);min-height:100vh}
h1,h2,h3,h4{font-family:"Noto Kufi Arabic","Noto Sans Arabic",sans-serif}
.shell{max-width:1500px;margin:0 auto;padding:26px}
.board{background:var(--card);border-radius:30px;box-shadow:0 40px 90px rgba(0,30,26,.35);display:flex;overflow:hidden;min-height:840px}

/* green icon rail (right) */
.rail{flex:0 0 80px;background:linear-gradient(180deg,var(--g-800),var(--g-700));display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 0}
.rail .brand{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:#fff}
.rail .brand svg{width:26px;height:26px}
.rail a{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.72);transition:.15s;position:relative}
.rail a svg{width:24px;height:24px}
.rail a:hover{background:rgba(255,255,255,.12);color:#fff}
.rail a.on{background:#fff;color:var(--g-800);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.rail a .tip{position:absolute;right:60px;background:var(--g-900);color:#fff;font-size:11.5px;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none}
/* top toolbar (filters moved up) + header user */
.who{display:flex;align-items:center;gap:10px}
.who .meta{text-align:left}.who .nm{font-size:12.5px;font-weight:700}.who .rl{font-size:11px;color:var(--muted)}
.who .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g-700),var(--emerald));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.who .logo{height:40px;width:auto;margin-inline-end:6px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tb{display:flex;align-items:center;gap:9px;background:#f5f9f8;border:1px solid var(--line);border-radius:12px;padding:10px 15px;font-size:13px;color:var(--ink)}
.tb .k{color:var(--muted);font-size:12px}.tb b{font-weight:700;color:var(--g-800)}
.tb svg{width:13px;height:13px;color:var(--muted)}
.toolbar .sp{flex:1}
.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.schip{flex:1;min-width:140px;background:#f5f9f8;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:baseline;gap:9px;justify-content:center}
.schip .n{font-family:"Noto Kufi Arabic";font-weight:800;font-size:21px;color:var(--g-800)}
.schip .l{font-size:12px;color:var(--ink-2)}
.ptabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.ptab{padding:10px 22px;border-radius:12px;border:1px solid var(--line);background:#f5f9f8;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.15s}
.ptab:hover{border-color:var(--g-400);color:var(--g-700)}
.ptab.on{background:linear-gradient(140deg,var(--g-800),var(--g-600));color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(0,88,76,.25)}
.vhost{min-width:0;flex:1;display:flex;flex-direction:column}
.ovgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ovc{padding:10px;text-align:center;border:1px solid var(--line);border-radius:14px;background:#fdfefe}
.ov-t{font-size:13px;font-weight:700;color:var(--g-900);margin-bottom:8px;font-family:"Noto Kufi Arabic"}
.tb.drop{position:relative;cursor:pointer}
.tb.drop .pop{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(0,40,34,.18);padding:16px;z-index:30;width:320px}
.tb.drop.open .pop{display:block}
.pop .pt{font-size:11.5px;color:var(--muted);font-weight:700;margin:2px 2px 8px;text-align:right}
.pop .years{display:flex;gap:6px;margin-bottom:12px}
.pop .allm{display:block;text-align:center;padding:8px 0;border-radius:9px;font-size:12px;border:1px solid var(--g-400);background:var(--g-50);color:var(--g-800);font-weight:700;margin-bottom:8px}

/* content */
.content{flex:1;min-width:0;padding:26px 30px 30px;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.ttl{display:flex;align-items:center;gap:16px}
.ttl .hlogo{height:54px;width:auto;display:block}
.ttl .div{width:1px;height:44px;background:var(--line)}
.chead h1{margin:0;font-size:22px;color:var(--g-900)}
.chead .crumb{font-size:12px;color:var(--muted);margin-top:4px}
.chead .who{display:flex;align-items:center;gap:10px}
.chead .who .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g-700),var(--emerald));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.chead .who .nm{font-size:13px;font-weight:700}.chead .who .rl{font-size:11px;color:var(--muted)}

/* KPI tab cards */
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tcard{background:#f5f9f8;border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.18s;position:relative}
.tcard:hover{border-color:var(--g-400)}
.tcard .ic{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--g-700);flex:0 0 40px}
.tcard .ic svg{width:21px;height:21px}
.tcard .v{font-size:21px;font-weight:800;font-family:"Noto Kufi Arabic";color:var(--g-900);line-height:1}
.tcard .l{font-size:11px;color:var(--ink-2);margin-top:4px;line-height:1.3}
.tcard.on{background:linear-gradient(140deg,var(--g-800),var(--g-600));border-color:transparent;box-shadow:0 14px 30px rgba(0,88,76,.30)}
.tcard.on .v,.tcard.on .l{color:#fff}
.tcard.on .ic{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}

/* main row */
.mrow{display:grid;grid-template-columns:1.9fr 1fr;gap:20px;flex:1}
.mrow.full{grid-template-columns:1fr}
.mrow>*{min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 3px 14px rgba(0,40,34,.05)}
.panel.center{display:flex;flex-direction:column}
.p-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.p-h h3{margin:0;font-size:16px;color:var(--g-900)}
.p-h .hint{font-size:11.5px;color:var(--muted)}
.view{display:none;flex:1;flex-direction:column;justify-content:center}
.view.show{display:flex}
/* overview grid (main page: all sections at once) */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;flex:1}
.vgrid .panel{display:flex;flex-direction:column}
.vgrid .panel .body{flex:1;display:flex;flex-direction:column;justify-content:center}
.two-ring{display:flex;gap:10px;justify-content:space-around;flex-wrap:wrap}

/* donut/ring */
.donut-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center}
.donut-wrap.stack{flex-direction:column;gap:18px}
.legend{display:flex;flex-direction:column;gap:11px;font-size:13px;color:var(--ink-2)}
.legend.row{flex-direction:row;flex-wrap:wrap;gap:9px 18px;justify-content:center;max-width:640px}
.legend .it{display:flex;align-items:center;gap:9px}.legend .sw{width:13px;height:13px;border-radius:4px;flex:0 0 13px}.legend b{color:var(--g-900);font-family:"Noto Kufi Arabic"}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring-note{font-size:12px;color:var(--ink-2);text-align:center}

/* left tracker panel */
.datep{display:flex;align-items:center;gap:7px;background:var(--g-50);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12.5px;color:var(--ink-2);height:fit-content}
.panel.side-panel{background:#f0f7f4;border-color:#dcebe4;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%}
.hero-circle{width:200px;height:200px;border-radius:50%;background:#fff;box-shadow:0 16px 38px rgba(0,60,50,.13);border:10px solid var(--g-100);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.hero-circle::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:2px dashed var(--g-400);opacity:.45}
.hero-n{font-family:"Noto Kufi Arabic";font-weight:800;font-size:68px;color:var(--g-800);line-height:1}
.hero-l{font-size:13.5px;color:var(--muted);margin-top:6px}
.hero-facts{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:8px}
.hf{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-size:12.5px}
.hf span{color:var(--ink-2)}
.hf b{color:var(--g-900);font-family:"Noto Kufi Arabic"}
/* sectors page */
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.dcard{background:#f5f9f8;border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.18s}
.dcard:hover{border-color:var(--g-400)}
.dcard .dn{font-size:13.5px;font-weight:800;color:var(--g-900);line-height:1.35;min-height:36px}
.dcard .dm{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.dcard .dm .b{font-family:"Noto Kufi Arabic";font-weight:800;font-size:23px;color:var(--g-800)}
.dcard .dm .s{font-size:11px;color:var(--muted)}
.dcard .dbar{height:6px;background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:10px}
.dcard .dbar>span{display:block;height:100%;background:var(--g-600);border-radius:5px}
.dcard .dpct{font-size:10.5px;color:var(--ink-2);margin-top:6px}
.dcard.on{background:linear-gradient(140deg,var(--g-800),var(--g-600));border-color:transparent;box-shadow:0 14px 30px rgba(0,88,76,.28)}
.dcard.on .dn,.dcard.on .dm .b{color:#fff}.dcard.on .dm .s,.dcard.on .dpct{color:#cfe6e0}
.dcard.on .dbar{background:rgba(255,255,255,.25);border-color:transparent}.dcard.on .dbar>span{background:#fff}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px}
.crumbs a{color:var(--g-700);font-weight:700;background:var(--g-50);border:1px solid var(--line);padding:6px 13px;border-radius:20px;cursor:pointer}
.crumbs a:hover{border-color:var(--g-400)}
.crumbs .sep{color:var(--muted)}
.crumbs .cur{color:#fff;background:linear-gradient(140deg,var(--g-800),var(--g-600));padding:6px 13px;border-radius:20px;font-weight:700}
.dsub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.dhead h3{margin:0;font-size:17px;color:var(--g-900)}
.dchips{display:flex;gap:8px;flex-wrap:wrap}
.dchip{background:var(--g-50);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;color:var(--ink-2)}
.dchip b{color:var(--g-800);font-family:"Noto Kufi Arabic";margin-inline-start:4px}
.d3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.dbox .bt{font-size:13px;font-weight:800;color:var(--g-900);margin-bottom:10px;font-family:"Noto Kufi Arabic"}
.split{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.split i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:800;font-family:"Noto Kufi Arabic";font-style:normal}
.slg{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.slg .i{display:flex;align-items:center;gap:6px}.slg .sw{width:10px;height:10px;border-radius:3px}
.side-panel .trk .bar{background:#fff;border-color:#e2ece8}
.side-panel{--ringtrack:#ffffff}
.side-panel .s-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.side-panel .s-h h3{margin:0;font-size:15px;color:var(--g-900)}
.cbars{display:flex;align-items:flex-end;justify-content:space-around;gap:12px;padding:12px 8px 0;min-height:250px}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0}
.cb .cbv{font-family:"Noto Kufi Arabic";font-weight:800;font-size:15px;color:var(--g-800)}
.cb .cbcol{width:44px;border-radius:10px 10px 4px 4px}
.cb .cbl{font-size:11.5px;color:var(--ink-2);text-align:center;line-height:1.35;min-height:30px}
.trk{display:flex;flex-direction:column;gap:12px}
.trk.wide{gap:13px}
.trk.wide .lb{flex:0 0 128px}
.trk.wide .n{flex:0 0 30px}
.trk.wide .bar{height:14px}
.trk .row{display:flex;align-items:center;gap:10px}
.trk .row .lb{flex:0 0 96px;font-size:11.5px;color:var(--ink-2);text-align:right;line-height:1.25}
.trk .row .bar{flex:1;height:12px;background:var(--g-50);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.trk .row .bar span{display:block;height:100%;border-radius:8px}
.trk .row .n{font-size:12px;font-weight:800;font-family:"Noto Kufi Arabic";color:var(--g-800);flex:0 0 22px;text-align:center}
.selq{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.years{display:flex;gap:6px;margin-bottom:10px}
.years .y{flex:1;text-align:center;padding:7px 0;border-radius:9px;font-size:12px;border:1px solid var(--line);color:var(--ink-2);font-weight:700}
.years .y.on{background:linear-gradient(140deg,var(--g-700),var(--g-500));color:#fff;border-color:transparent}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.months .m{text-align:center;padding:7px 0;border-radius:8px;font-size:11px;border:1px solid var(--line);color:var(--ink-2)}
.months .m.on{background:var(--g-100);color:var(--g-800);font-weight:700;border-color:var(--g-400)}

/* detail area below hero */
.detail{margin-top:22px;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 3px 14px rgba(0,40,34,.05);overflow:hidden}
.tbl-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.tbl-h h3{margin:0;font-size:15px;color:var(--g-900)}
.sec-t{display:flex;align-items:center;gap:10px;margin:6px 2px 2px}
.sec-t .b{width:5px;height:20px;border-radius:5px;background:linear-gradient(var(--g-700),var(--g-500))}
.sec-t h2{margin:0;font-size:17px;color:var(--g-900)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--g-50);color:var(--g-800);font-weight:700;text-align:right;padding:12px 15px;white-space:nowrap;font-size:12.5px;border-bottom:1px solid var(--line)}
tbody td{padding:12px 15px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:last-child td{border-bottom:none}
tr.total td{background:var(--g-50);font-weight:800;color:var(--g-900)}
.badge{display:inline-flex;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700}
.b-good{background:#e4f6ec;color:#127a45}.b-warn{background:#fbf0d9;color:#946408}.b-info{background:var(--g-100);color:var(--g-700)}.b-crit{background:#fbe4e4;color:#b23434}.b-mut{background:#eef1f0;color:#5f6f6a}
.chip2{font-size:11.5px;color:var(--g-700);background:var(--g-100);padding:4px 12px;border-radius:20px;font-weight:700}
.flow{display:flex;flex-direction:column}
.flow .step-row{display:flex;gap:12px;padding-bottom:16px}.flow .step-row:last-child{padding-bottom:0}
.flow .rail2{flex:0 0 32px;display:flex;flex-direction:column;align-items:center;gap:6px}
.flow .rail2 .ln{width:2px;flex:1;background:var(--g-100)}.flow .rail2 .ln.hide{background:transparent}
.flow .rail2 .dot{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--g-800),var(--g-600));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:"Noto Kufi Arabic";flex:0 0 32px}
.flow .card{flex:1;min-width:0}
/* actions, edit mode, modal */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent;font-family:"Noto Sans Arabic";transition:.15s}
.btn svg{width:15px;height:15px}
.btn-p{background:linear-gradient(140deg,var(--g-800),var(--g-600));color:#fff;box-shadow:0 8px 18px rgba(0,88,76,.22)}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:#fff;border-color:var(--line);color:var(--g-700)}
.btn-g:hover{border-color:var(--g-400)}
.btn-x{background:var(--g-50);border-color:var(--line);color:var(--ink-2)}
.hact{display:flex;align-items:center;gap:8px}
.iact{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--g-700);display:none;align-items:center;justify-content:center;cursor:pointer}
.iact svg{width:14px;height:14px}
.iact:hover{border-color:var(--g-400);background:var(--g-50)}
.iact.del{color:var(--red)}
body.edit .iact{display:inline-flex}
body.edit .editable{outline:1.5px dashed var(--g-400);outline-offset:5px;border-radius:6px}
body.edit .editable:focus{outline:2px solid var(--g-600);background:var(--g-50)}
.editbar{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--g-900);color:#fff;border-radius:16px;padding:12px 18px;gap:12px;align-items:center;box-shadow:0 18px 40px rgba(0,0,0,.3);z-index:60;font-size:13px}
body.edit .editbar{display:flex}
.editbar .btn-p{background:#fff;color:var(--g-800)}
.editbar .btn-x{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
/* modal */
.mask{display:none;position:fixed;inset:0;background:rgba(6,40,34,.45);z-index:70;align-items:center;justify-content:center;padding:24px}
.mask.open{display:flex}
.sheet{background:#fff;border-radius:22px;width:min(700px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.sheet-h h3{margin:0;font-size:16.5px;color:var(--g-900)}
.xbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1}
.sheet-b{padding:20px 22px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld2{display:flex;flex-direction:column;gap:6px}
.fld2.full{grid-column:1/-1}
.fld2 label{font-size:11.5px;color:var(--muted);font-weight:700}
.fld2 .inp{background:#f7fbfa;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--ink);font-family:"Noto Sans Arabic";display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.fld2 .inp svg{width:14px;height:14px;flex:0 0 14px;color:var(--muted)}
.fld2 .inp.ph{color:var(--muted)}
.sheet-f{display:flex;justify-content:flex-start;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.foot{margin-top:16px;text-align:center;color:rgba(255,255,255,.65);font-size:11.5px}
/* people cards (replace excel-like tables) */
.plist{display:flex;flex-direction:column;gap:12px;padding:16px 18px}
.prow{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:0 2px 8px rgba(0,40,34,.04);flex-wrap:wrap}
.prow:hover{border-color:var(--g-400)}
.pav{width:46px;height:46px;border-radius:50%;background:var(--g-100);color:var(--g-800);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;font-family:"Noto Kufi Arabic";flex:0 0 46px}
.pid{flex:0 0 170px;min-width:150px}
.pid .pn{font-weight:800;font-size:14px;color:var(--ink)}
.pid .pp{font-size:12px;color:var(--muted);margin-top:3px}
.pmeta{display:flex;gap:8px 26px;flex:1;flex-wrap:wrap;align-items:center}
.mi{display:flex;flex-direction:column;gap:3px;min-width:88px}
.mi .k{font-size:10.5px;color:var(--muted)}
.mi .v{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pend{margin-inline-start:auto}
/* stage follow-up: summary + people accordion + stepper */
.sumrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sum{flex:1;min-width:118px;background:var(--g-50);border:1px solid var(--line);border-radius:13px;padding:11px 12px;text-align:center}
.sum .n{font-family:"Noto Kufi Arabic";font-weight:800;font-size:21px;color:var(--g-800);line-height:1}
.sum .l{font-size:11px;color:var(--ink-2);margin-top:5px}
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc .head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.acc .head:hover{background:var(--g-50)}
.acc .chev{color:var(--muted);transition:.2s}
.acc.open .chev{transform:rotate(180deg)}
.acc .nm{font-weight:700;font-size:13.5px;color:var(--ink)}
.acc .pos{font-size:12px;color:var(--muted);flex:1}
.acc .body{display:none;padding:4px 18px 20px;border-top:1px dashed var(--line)}
.acc.open .body{display:block}
.acc .note{font-size:12px;color:var(--ink-2);margin-top:14px;background:var(--g-50);border:1px solid var(--line);border-radius:9px;padding:8px 12px;display:inline-block}
.stepper{display:flex;margin-top:18px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step:not(:first-child)::before{content:"";position:absolute;top:14px;inset-inline-start:-50%;width:100%;height:3px;background:#e8edeb;border-radius:2px}
.step.done:not(:first-child)::before,.step.cur:not(:first-child)::before{background:var(--g-600)}
.step .c{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;font-family:"Noto Kufi Arabic";z-index:1;background:#eef1f0;color:#b3bdb9;border:2px solid #e4e9e7}
.step.done .c{background:var(--g-600);color:#fff;border-color:var(--g-600)}
.step.cur .c{background:var(--g-800);color:#fff;border-color:var(--g-800);box-shadow:0 0 0 5px rgba(0,88,76,.14)}
.step .t{font-size:10.5px;margin-top:8px;color:#bcc6c2;text-align:center;line-height:1.3}
.step.done .t{color:var(--g-700);font-weight:600}
.step.cur .t{color:var(--g-900);font-weight:800}

/* ===== إضافات التطبيق فوق التصميم الأساسي ===== */

.boot{color:#fff;text-align:center;padding:80px;font-family:"Noto Sans Arabic",sans-serif}

/* شاشة الدخول */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#fff;border-radius:26px;padding:34px 30px;width:min(430px,100%);
  box-shadow:0 30px 70px rgba(0,30,26,.35);text-align:center}
.login-logo{height:64px;width:auto;margin-bottom:14px}
.login-card h2{margin:0 0 4px;font-size:19px;color:var(--g-900)}
.login-sub{font-size:12.5px;color:var(--muted);margin:0 0 20px}
.login-card .fld2{text-align:right;margin-bottom:14px}
.login-err{background:#fbe4e4;color:#b23434;border-radius:11px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
.login-btn{width:100%;justify-content:center;margin-top:6px}
.code-inp{letter-spacing:.5em;text-align:center;font-size:19px!important;font-weight:800;font-family:"Noto Kufi Arabic",sans-serif}

/* حقول الإدخال الحقيقية */
input.inp,select.inp{width:100%;background:#f7fbfa;border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:13px;color:var(--ink);font-family:"Noto Sans Arabic",sans-serif;min-height:44px;outline:none}
input.inp:focus,select.inp:focus{border-color:var(--g-500);background:#fff}
input.inp:focus-visible,select.inp:focus-visible,.btn:focus-visible,.ptab:focus-visible{outline:2px solid var(--g-600);outline-offset:2px}
select.inp{appearance:none;background-image:none}

/* فلاتر الشريط العلوي */
.sel-wrap{position:relative;cursor:pointer}
.sel-wrap select{appearance:none;border:none;background:transparent;font-family:"Noto Sans Arabic",sans-serif;
  font-size:13px;font-weight:700;color:var(--g-800);cursor:pointer;outline:none;padding-inline-end:4px;max-width:190px}
.sel-wrap svg{pointer-events:none}

/* أزرار التعديل والحذف — ظاهرة دائمًا لمن يملك الصلاحية */
.iact{display:inline-flex}
.iact.logout{margin-inline-start:4px}

/* رسالة فراغ */
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

/* تنبيه سريع */
.toast{position:fixed;bottom:24px;right:50%;transform:translate(50%,20px);background:var(--g-900);color:#fff;
  padding:12px 22px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90;
  font-family:"Noto Sans Arabic",sans-serif;box-shadow:0 16px 36px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(50%,0)}

/* حاوية النموذج */
#formSheet{background:#fff;border-radius:22px;width:min(720px,100%);max-height:88vh;overflow:auto}

/* عناوين قابلة للتحرير */
.ttl-edit{outline:none}

/* منع تمدّد البطاقات مع محتواها (يسبب تجاوزًا أفقيًا) */
.vgrid>*,.vhost>*,.panel,.panel .body,.donut-wrap{min-width:0;max-width:100%}

/* روابط البطاقات بدون تسطير */
a.tcard,a.tcard *{text-decoration:none}
a.tcard .v{color:var(--g-900)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ الأجهزة اللوحية ============ */
@media (max-width:1100px){
  .mrow{grid-template-columns:1fr!important}
  .vgrid{grid-template-columns:1fr}
  .dgrid{grid-template-columns:repeat(2,1fr)}
  .d3{grid-template-columns:1fr}
  .panel.side-panel{order:-1}
  .hero-circle{width:170px;height:170px}
  .hero-n{font-size:56px}
}

/* ============ الجوال ============ */
@media (max-width:760px){
  .shell{padding:0}
  .board{border-radius:0;min-height:100vh;flex-direction:column;box-shadow:none}

  /* شريط التنقّل يصبح سفليًا ثابتًا */
  .rail{flex:0 0 auto;width:100%;flex-direction:row;justify-content:space-around;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));gap:2px;
    position:fixed;bottom:0;right:0;left:0;z-index:40;
    border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.22)}
  .rail a{width:52px;height:46px;border-radius:12px}
  .rail a svg{width:22px;height:22px}
  .rail a .tip{display:none}

  .content{padding:16px 14px 96px}

  /* الترويسة */
  .chead{flex-direction:column;align-items:stretch;gap:12px;margin-bottom:14px}
  .ttl{gap:10px}
  .ttl .hlogo{height:40px}
  .ttl .div{height:34px}
  .chead h1{font-size:18px}
  .chead .crumb{font-size:11px}
  .who{justify-content:flex-end}

  /* الفلاتر */
  .toolbar{gap:8px;margin-bottom:14px}
  .tb{padding:9px 12px;font-size:12px;flex:1 1 46%;justify-content:space-between}
  .toolbar .sp{display:none}
  .toolbar .btn{flex:1 1 100%;justify-content:center}
  .sel-wrap select{max-width:100%;flex:1}

  /* التبويبات: تمرير أفقي */
  .ptabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ptab{flex:0 0 auto;padding:9px 16px;font-size:12.5px}

  /* البطاقات العلوية */
  .tcards{grid-template-columns:repeat(2,1fr);gap:10px}
  .tcard{padding:12px}
  .tcard .v{font-size:19px}
  .tcard .l{font-size:10.5px}

  /* اللوحات والرسوم */

  function writeLocal(db) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) {}
  }

  /* ---------- عميل Supabase ---------- */
  let sb = null;
  function client() {
    if (!HAS_REMOTE) return null;
    if (!sb && window.supabase) {
      sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    }
    return sb;

    isRemote: HAS_REMOTE,

    async loadAll() {
      if (!HAS_REMOTE) { this.cache = readLocal(); return this.cache; }
      const c = client();
      const out = {};
      for (const t of TABLES) {
        const { data, error } = await c.from(t).select("*");
        if (error) throw new Error(`تعذّر تحميل ${t}: ${error.message}`);
        out[t] = data || [];
      }
      this.cache = out;
      return out;
    },

    async insert(table, row) {
      row = Object.assign({}, row);
      if (!HAS_REMOTE) {
        row.id = row.id || uid();
        this.cache[table].push(row);
        writeLocal(this.cache);
        return row;
      }
      const { data, error } = await client().from(table).insert(row).select().single();
      if (error) throw new Error(error.message);
      this.cache[table].push(data);
      return data;
    },

    async update(table, id, patch) {
      if (!HAS_REMOTE) {
        const i = this.cache[table].findIndex((r) => r.id === id);
        if (i > -1) Object.assign(this.cache[table][i], patch);
        writeLocal(this.cache);
        return this.cache[table][i];
      }
      const { data, error } = await client().from(table).update(patch).eq("id", id).select().single();
      if (error) throw new Error(error.message);
      const i = this.cache[table].findIndex((r) => r.id === id);
      if (i > -1) this.cache[table][i] = data;
      return data;
    },

    async remove(table, id) {
      if (!HAS_REMOTE) {
        this.cache[table] = this.cache[table].filter((r) => r.id !== id);
        writeLocal(this.cache);
        return true;
      }
      const { error } = await client().from(table).delete().eq("id", id);
      if (error) throw new Error(error.message);
      this.cache[table] = this.cache[table].filter((r) => r.id !== id);
      return true;

      const codes = CFG.ACCESS_CODES || {};
      let role = null;
      for (const r of ["owner", "editor", "viewer"]) {
        if (codes[r] && String(code).trim() === String(codes[r])) { role = r; break; }
      }
      if (!role) throw new Error("رمز الدخول غير صحيح");
      const u = { name: (name || "").trim() || "مستخدم", role: role, demo: true };
      sessionStorage.setItem("adaa_hr_user", JSON.stringify(u));
      return u;
    },

    async signOut() {
      sessionStorage.removeItem("adaa_hr_user");
      if (HAS_REMOTE) await client().auth.signOut();
    },
  };

  window.DB = DB;
  window.AUTH = AUTH;
  window.SEED = SEED;
})();

</script>
<script>
/* ===========================================================
   داشبورد إدارة استقطاب المواهب — مركز أداء
   تطبيق صفحة واحدة (SPA) بتوجيه عبر الـ hash
   =========================================================== */
(function () {
  const CFG = window.APP_CONFIG || {};
  const MONTHS = ["ينا", "فبر", "مار", "أبر", "ماي", "يون", "يول", "أغس", "سبت", "أكت", "نوف", "ديس"];
  const MONTHS_FULL = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  const STAGES = ["المقابلة", "العرض الأولي", "المسح الأمني", "الفحص الطبي", "العرض النهائي", "الانضمام"];
  const PALETTE = ["var(--g-800)", "var(--emerald)", "var(--g-700)", "var(--g-600)", "var(--g-500)", "var(--gold)", "var(--g-400)"];

  const state = {
    page: "index",
    tab: null,
    node: "root",
    user: null,
    filters: { unit: "", year: 2026, month: 0 }, // month=0 يعني كل الأشهر
    edit: false,
  };

  /* ---------------- أدوات ---------------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const db = () => DB.cache;
  const canEdit = () => state.user && (state.user.role === "editor" || state.user.role === "owner");
  const canEditTitles = () => state.user && state.user.role === "owner";
  const ROLE_LABEL = { owner: "مالك الداشبورد", editor: "مُدخِل بيانات", viewer: "عرض فقط" };

  const ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M17.5 20c0-2.4-1-4.2-2.6-5"/>',
    cap: '<path d="M12 4 22 9l-10 5L2 9z"/><path d="M6 11v5c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-5"/>',
    exit: '<path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9"/><path d="M11 12h9M17 8l4 4-4 4"/>',
    office: '<path d="M3 21h18M5 21V6a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v15M13 21V10h5a1 1 0 0 1 1 1v10"/><path d="M8 9h2M8 13h2M8 17h2M16 14h.01M16 17h.01"/>',
    pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  };
  const icon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ""}</svg>`;
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';

  /* ---------------- الهيكل التنظيمي ---------------- */
  function units() { return db().org_units || []; }
  function unitById(id) { return units().find((u) => u.id === id); }
  function childrenOf(id) { return units().filter((u) => (u.parent_id || null) === (id || null)); }
  function roots() { return childrenOf(null); }

  function aggregate(id) {
    const t = { approved: 0, filled: 0, junior: 0, senior: 0, male: 0, female: 0 };
    const kids = childrenOf(id);
    if (!kids.length) {
      const u = unitById(id);
      if (u) for (const k in t) t[k] = Number(u[k] || 0);
      return t;
    }
    for (const k of kids) {
      const s = aggregate(k.id);
      for (const key in t) t[key] += s[key];
    }
    return t;
  }
  function aggregateAll() {
    const t = { approved: 0, filled: 0, junior: 0, senior: 0, male: 0, female: 0 };
    for (const r of roots()) {
      const s = aggregate(r.id);
      for (const k in t) t[k] += s[k];
    }
    return t;
  }
  function pathOf(id) {
    const out = [];
    let cur = id;
    while (cur) { out.unshift(cur); const u = unitById(cur); cur = u ? u.parent_id : null; }
    return out;
  }
  // يرجّع القطاع الجذر لأي وحدة
  function rootOf(id) { const p = pathOf(id); return p[0] || id; }

  /* ---------------- الفلاتر ---------------- */
  function inPeriod(r) {
    if (!r) return false;
    if (state.filters.year && Number(r.year) !== Number(state.filters.year)) return false;
    if (state.filters.month && Number(r.month) !== Number(state.filters.month)) return false;
    return true;
  }
  function inUnit(r) {
    const f = state.filters.unit;
    if (!f) return true;
    if (!r.unit_id) return true;
    return pathOf(r.unit_id).includes(f);
  }
  const rows = (t) => (db()[t] || []).filter((r) => inPeriod(r) && inUnit(r));

  /* ---------------- الرسوم ---------------- */
  function donut(segs, ctop, cbot, opts) {
    opts = opts || {};
    const size = opts.size || 200;
    const total = segs.reduce((s, x) => s + x[1], 0) || 1;
    let ang = -90, paths = "";
    const R = 74, r = 49, cx = 94, cy = 94;
    for (const [lab, v, col] of segs) {
      const sw = (v / total) * 360;
      const a0 = (ang * Math.PI) / 180, a1 = ((ang + sw) * Math.PI) / 180;
      const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
      const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
      const xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1);
      const xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
      const lg = sw > 180 ? 1 : 0;
      paths += `<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${lg} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L ${xi1.toFixed(2)} ${yi1.toFixed(2)} A ${r} ${r} 0 ${lg} 0 ${xi0.toFixed(2)} ${yi0.toFixed(2)} Z" fill="${col}" stroke="#fff" stroke-width="2.5"/>`;
      ang += sw;
    }
    const svg = `<svg viewBox="0 0 188 188" width="${size}" height="${size}">${paths}
      <text x="94" y="88" text-anchor="middle" style="font-size:30px;font-weight:800;font-family:Noto Kufi Arabic;fill:var(--g-800)">${ctop}</text>
      <text x="94" y="110" text-anchor="middle" style="font-size:13px;fill:var(--muted)">${cbot}</text></svg>`;
    const leg = segs.map(([l, v, c]) => `<div class="it"><span class="sw" style="background:${c}"></span>${esc(l)} <b>(${v})</b></div>`).join("");
    return `<div class="donut-wrap${opts.stack ? " stack" : ""}">${svg}<div class="legend${opts.row ? " row" : ""}">${leg}</div></div>`;
  }

  function ring(p, col, label, note, size) {
    const R = 60, C = 2 * Math.PI * R, off = C * (1 - p / 100);
    return `<div class="ring-wrap"><svg viewBox="0 0 154 154" width="${size || 240}" height="${size || 240}">
      <circle cx="77" cy="77" r="${R}" fill="none" stroke="var(--ringtrack,var(--g-50))" stroke-width="15"/>
      <circle cx="77" cy="77" r="${R}" fill="none" stroke="${col}" stroke-width="15" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 77 77)"/>
      <text x="77" y="72" text-anchor="middle" style="font-size:32px;font-weight:800;font-family:Noto Kufi Arabic;fill:var(--g-800)">${p}%</text>
      <text x="77" y="95" text-anchor="middle" style="font-size:12px;fill:var(--muted)">${esc(label)}</text></svg>
      ${note ? `<div class="ring-note">${esc(note)}</div>` : ""}</div>`;
  }

  function colbars(items, maxh) {
    maxh = maxh || 190;
    const mx = Math.max(...items.map((i) => i[1]), 1);
    const cols = items.map(([l, v, c]) => `<div class="cb"><div class="cbv">${v}</div>
      <div class="cbcol" style="height:${Math.max(14, (v / mx) * maxh).toFixed(0)}px;background:${c}"></div>
      <div class="cbl">${esc(l)}</div></div>`).join("");
    return `<div class="cbars">${cols}</div>`;
  }

  function splitbar(parts) {
    const tot = parts.reduce((s, p) => s + p[1], 0) || 1;
    const bars = parts.map(([l, v, c]) => `<i style="width:${((v / tot) * 100).toFixed(1)}%;background:${c}">${v}</i>`).join("");
    const lg = parts.map(([l, v, c]) => `<div class="i"><span class="sw" style="background:${c}"></span>${esc(l)}</div>`).join("");
    return `<div class="split">${bars}</div><div class="slg">${lg}</div>`;
  }

  /* ---------------- بطاقات الأشخاص ---------------- */
  function pcard(name, pos, metas, badge, act) {
    const m = metas.filter(([k, v]) => v && v !== "—")
      .map(([k, v]) => `<div class="mi"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("");
    const b = badge ? `<span class="badge ${badge[1]}">${esc(badge[0])}</span>` : "";
    const acts = act && canEdit()
      ? `<span class="iact" title="تعديل" onclick="APP.openForm('${act.form}','${act.id}')">${icon("pen")}</span>
         <span class="iact del" title="حذف" onclick="APP.removeRow('${act.table}','${act.id}')">${icon("trash")}</span>` : "";
    return `<div class="prow"><div class="pav">${esc((name || "?").trim()[0])}</div>
      <div class="pid"><div class="pn">${esc(name)}</div><div class="pp">${esc(pos)}</div></div>
      <div class="pmeta">${m}</div><div class="pend hact">${b}${acts}</div></div>`;
  }

  function plist(title, chip, cards, add) {
    const a = add && canEdit() ? `<button class="btn btn-p" onclick="APP.openForm('${add[1]}')">${icon("plus")} ${esc(add[0])}</button>` : "";
    return `<div class="card"><div class="tbl-h"><h3 class="ttl-edit" data-k="${esc(title)}">${esc(title)}</h3>
      <div class="hact"><span class="chip2">${esc(chip)}</span>${a}</div></div>
      <div class="plist">${cards || '<div class="empty">لا توجد بيانات مطابقة للفلاتر الحالية</div>'}</div></div>`;
  }

  /* ---------------- الصفحات ---------------- */
  // اللوحة الرئيسية
  function pageIndex() {
    const vac = rows("vacancies");
    const totalVac = vac.reduce((s, v) => s + Number(v.count || 0), 0);
    const received = vac.reduce((s, v) => s + Number(v.received || 0), 0);
    const cands = rows("candidates");
    const done = cands.filter((c) => c.stage >= 5).length;
    const inprog = cands.filter((c) => c.stage < 5).length;
    const trainees = rows("trainees");
    const resg = rows("resignations");
    const target = Number((db().settings.find((s) => s.key === "training_target") || {}).value || 80);
    const trDone = trainees.filter((t) => t.status === "مكتمل").length;
    const trProg = trainees.filter((t) => t.status === "تحت الإجراء").length;
    const trOn = trainees.filter((t) => t.status === "قائم").length;

    const bySector = roots().map((r, i) => [r.name, resg.filter((x) => x.unit_id && rootOf(x.unit_id) === r.id).length, PALETTE[i % PALETTE.length]]);

    const cards = [
      ["recruitment", "users", received, "طلبات التوظيف المستلمة"],
      ["training", "cap", trainees.length, "طلبات التدريب"],
      ["resignations", "exit", resg.length, "الاستقالات"],
      ["recruitment", "check", pct(done, totalVac) + "%", "نسبة إنجاز التوظيف"],
    ].map(([href, ic, v, l]) => `<a class="tcard" href="#/${href}"><div class="ic">${icon(ic)}</div>
      <div><div class="v">${v}</div><div class="l">${esc(l)}</div></div></a>`).join("");

    const panels = [
      ["توزيع حالة طلبات التوظيف", `من إجمالي ${totalVac + inprog + done}`,
        donut([["شاغرة", totalVac, "var(--g-400)"], ["تحت الإجراء", inprog, "var(--g-600)"], ["مكتملة", done, "var(--g-800)"]],
          totalVac + inprog + done, "إجمالي", { size: 240 })],
      ["توزيع حالة طلبات التدريب", `من إجمالي ${trainees.length}`,
        donut([["مكتملة", trDone, "var(--emerald)"], ["تحت الإجراء", trProg, "var(--g-600)"], ["قائم", trOn, "var(--g-400)"]],
          trainees.length, "طلب", { size: 240 })],
      ["توزيع الاستقالات حسب القطاع", `الإجمالي ${resg.length}`, colbars(bySector)],
    ].map((p, i, arr) => `<div class="panel"${i === arr.length - 1 && arr.length % 2 === 1 ? ' style="grid-column:1/-1"' : ""}>
      <div class="p-h"><h3 class="ttl-edit" data-k="${esc(p[0])}">${esc(p[0])}</h3><span class="hint">${esc(p[1])}</span></div>
      <div class="body">${p[2]}</div></div>`).join("");

    return `<div class="tcards">${cards}</div><div class="mrow full"><div class="vgrid">${panels}</div></div>`;
  }

  // التوظيف
  function pageRecruitment() {
    const vac = rows("vacancies");
    const cands = rows("candidates");
    const ivs = rows("interviews");
    const totalVac = vac.reduce((s, v) => s + Number(v.count || 0), 0);
    const received = vac.reduce((s, v) => s + Number(v.received || 0), 0);
    const done = cands.filter((c) => c.stage >= 5).length;
    const rate = pct(done, totalVac);

    const bySectorVac = roots().map((r, i) => [r.name, vac.filter((v) => rootOf(v.unit_id) === r.id).reduce((s, v) => s + Number(v.count || 0), 0), PALETTE[i % PALETTE.length]]);
    const bySectorRec = roots().map((r, i) => [r.name, vac.filter((v) => rootOf(v.unit_id) === r.id).reduce((s, v) => s + Number(v.received || 0), 0), PALETTE[i % PALETTE.length]]);

    const ivDone = ivs.filter((i) => i.status === "تمت").length;
    const ivRej = ivs.filter((i) => i.status === "مرفوضة").length;
    const ivSch = ivs.filter((i) => i.status === "مجدولة").length;

    const ov = `<div class="vgrid">
      <div class="panel" style="grid-column:1/-1"><div class="p-h"><h3 class="ttl-edit">حالة المقابلات</h3></div>
        <div class="body">${donut([["مجدولة", ivSch, "var(--amber)"], ["مرفوضة", ivRej, "var(--red)"], ["مكتملة", ivDone, "var(--g-800)"]], ivs.length, "مقابلة", { size: 190 })}</div></div>
      <div class="panel" style="grid-column:1/-1"><div class="p-h"><h3 class="ttl-edit">الوظائف الشاغرة حسب القطاع</h3><span class="hint">الإجمالي ${totalVac}</span></div>
        <div class="body">${colbars(bySectorVac)}</div></div>
      <div class="panel" style="grid-column:1/-1"><div class="p-h"><h3 class="ttl-edit">الطلبات المستلمة حسب القطاع</h3><span class="hint">الإجمالي ${received}</span></div>
        <div class="body">${colbars(bySectorRec)}</div></div></div>`;

    // المقابلات
    const ivCards = ivs.map((r) => pcard(r.candidate, r.position, [
      ["الإدارة", (unitById(r.unit_id) || {}).name], ["مالك الوظيفة", r.owner],
      ["التاريخ", r.date ? r.date + (r.day ? " · " + r.day : "") : ""], ["الوقت", r.time],
      ["مصدر الوظيفة", r.job_source], ["مصدر المرشح", r.cand_source_name ? r.cand_source + " · " + r.cand_source_name : r.cand_source],
      ["تقييم الموارد البشرية", r.hr_rating], ["تقييم الإدارة", r.mgr_rating],
    ], [r.status, r.status === "تمت" ? "b-good" : r.status === "مرفوضة" ? "b-crit" : "b-info"],
      { form: "interview", id: r.id, table: "interviews" })).join("");

    // المراحل
    const sum = STAGES.slice(1).map((s, i) => `<div class="sum"><div class="n">${cands.filter((c) => c.stage >= i + 1).length}</div><div class="l">${esc(s)}</div></div>`).join("");
    const accs = cands.map((c, i) => {
      const steps = STAGES.map((s, si) => {
        const cls = si < c.stage ? "done" : si === c.stage ? "cur" : "";
        return `<div class="step ${cls}"><div class="c">${si < c.stage ? "✓" : si + 1}</div><div class="t">${esc(s)}</div></div>`;
      }).join("");
      const upd = canEdit() ? `<button class="btn btn-g" onclick="APP.openForm('candidate','${c.id}')">${icon("pen")} تحديث المرحلة</button>` : "";
      return `<div class="acc ${i === 0 ? "open" : ""}"><div class="head" onclick="this.parentElement.classList.toggle('open')">
        <span class="nm">${esc(c.name)}</span><span class="pos">${esc(c.position)}</span>
        <span class="badge b-info">${esc(STAGES[c.stage] || "")}</span><span class="chev">${CHEV}</span></div>
        <div class="body"><div class="stepper">${steps}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap">
        <div class="note" style="margin:0">آخر تحديث: ${esc(c.note || "—")}</div>${upd}</div></div></div>`;
    }).join("");
    const addCand = canEdit() ? `<div style="display:flex;margin-bottom:14px"><button class="btn btn-p" onclick="APP.openForm('candidate')">${icon("plus")} إضافة مرشح</button></div>` : "";

    const onbCards = rows("onboarding").map((r) => pcard(r.name, r.position, [
      ["الدرجة", r.grade], ["تاريخ المباشرة", r.start_date], ["الملاحظات", r.notes],
    ], null, { form: "onboarding", id: r.id, table: "onboarding" })).join("");

    const flow = addCand + `<div class="sumrow">${sum}</div>` + (accs || '<div class="empty">لا يوجد مرشحون</div>') +
      `<div style="margin-top:22px"></div>` + plist("مرحلة الانضمام", rows("onboarding").length + " منضم", onbCards, ["إضافة منضم", "onboarding"]);

    const views = [
      ["ov", ov],
      ["iv", plist("جدول المقابلات", ivs.length + " مقابلة", ivCards, ["إضافة مقابلة", "interview"])],
      ["flow", flow],
    ];
    const side = `<div class="s-h"><h3 class="ttl-edit">نسبة إنجاز التوظيف</h3></div>
      <div class="hero">${ring(rate, "var(--g-700)", "إنجاز التوظيف", `${done} مكتمل من ${totalVac} شاغرة`, 290)}</div>`;

    return tabbed([["ov", "نظرة عامة"], ["iv", "المقابلات"], ["flow", "مراحل التوظيف"]], views, side);
  }

  // التدريب
  function pageTraining() {
    const tr = rows("trainees");
    const target = Number((db().settings.find((s) => s.key === "training_target") || {}).value || 80);
    const done = tr.filter((t) => t.status === "مكتمل").length;
    const prog = tr.filter((t) => t.status === "تحت الإجراء").length;
    const on = tr.filter((t) => t.status === "قائم").length;
    const dist = roots().map((r, i) => [r.name, tr.filter((t) => t.unit_id && rootOf(t.unit_id) === r.id).length, PALETTE[i % PALETTE.length]]);

    const ov = `<div class="vgrid">
      <div class="panel"><div class="p-h"><h3 class="ttl-edit">حالة طلبات التدريب</h3><span class="hint">من إجمالي ${tr.length}</span></div>
        <div class="body">${donut([["مكتملة", done, "var(--emerald)"], ["تحت الإجراء", prog, "var(--g-600)"], ["قائم", on, "var(--g-400)"]], tr.length, "طلب", { size: 190 })}</div></div>
      <div class="panel"><div class="p-h"><h3 class="ttl-edit">نسبة الإنجاز من الطلبات</h3></div>
        <div class="body">${ring(pct(done, tr.length), "var(--emerald)", "من الطلبات", `${done} مكتمل من ${tr.length}`, 200)}</div></div>
      <div class="panel" style="grid-column:1/-1"><div class="p-h"><h3 class="ttl-edit">توزيع المتدربين على القطاعات</h3><span class="hint">الإجمالي ${tr.length}</span></div>
        <div class="body">${colbars(dist)}</div></div></div>`;

    const cards = tr.map((r) => pcard(r.name, r.university, [
      ["المشرف التدريبي", r.supervisor], ["الإدارة", (unitById(r.unit_id) || {}).name],
      ["بداية التدريب", r.start_date], ["نهاية التدريب", r.end_date], ["رقم الجوال", r.phone],
    ], [r.status, r.status === "مكتمل" ? "b-info" : r.status === "تحت الإجراء" ? "b-warn" : "b-good"],
      { form: "trainee", id: r.id, table: "trainees" })).join("");

    const side = `<div class="s-h"><h3 class="ttl-edit">المحقق من المستهدف</h3></div>
      <div class="hero">${ring(pct(tr.length, target), "var(--g-700)", "من المستهدف", `${tr.length} من مستهدف ${target}`, 290)}</div>`;

    return tabbed([["ov", "نظرة عامة"], ["tt", "المتدربون"]],
      [["ov", ov], ["tt", plist("جدول المتدربين", tr.length + " متدرب", cards, ["إضافة متدرب", "trainee"])]], side);
  }

  // الاستقالات
  function pageResignations() {
    const rs = rows("resignations");
    const dist = roots().map((r, i) => [r.name, rs.filter((x) => x.unit_id && rootOf(x.unit_id) === r.id).length, PALETTE[i % PALETTE.length]]);
    const grades = {};
    rs.forEach((r) => { if (r.grade) grades[r.grade] = (grades[r.grade] || 0) + 1; });
    const gsegs = Object.keys(grades).map((g, i) => [g, grades[g], PALETTE[i % PALETTE.length]]);
    const thisMonth = rs.filter((r) => Number(r.month) === new Date().getMonth() + 1).length;
    const top = dist.slice().sort((a, b) => b[1] - a[1])[0] || ["—", 0];

    const ov = `<div class="vgrid">
      <div class="panel" style="grid-column:1/-1"><div class="p-h"><h3 class="ttl-edit">حسب الدرجة</h3></div>
        <div class="body">${gsegs.length ? donut(gsegs, rs.length, "استقالة", { size: 190 }) : '<div class="empty">لا توجد بيانات</div>'}</div></div>
      <div class="panel" style="grid-column:1/-1"><div class="p-h"><h3 class="ttl-edit">توزيع الاستقالات حسب القطاع</h3><span class="hint">الإجمالي ${rs.length}</span></div>
        <div class="body">${colbars(dist)}</div></div></div>`;

    const cards = rs.map((r) => pcard(r.name, r.position, [
      ["الدرجة", r.grade], ["الإدارة", (unitById(r.unit_id) || {}).name], ["آخر يوم عمل", r.last_day], ["السبب", r.reason],
    ], null, { form: "resignation", id: r.id, table: "resignations" })).join("");

    const side = `<div class="s-h"><h3 class="ttl-edit">عدد الاستقالات</h3></div>
      <div class="hero"><div class="hero-circle"><span class="hero-n">${rs.length}</span><span class="hero-l">استقالة حتى اليوم</span></div>
      <div class="hero-facts"><div class="hf"><span>استقالات الشهر الحالي</span><b>${thisMonth}</b></div>
      <div class="hf"><span>أعلى قطاع</span><b>${esc(top[0])} · ${top[1]}</b></div></div></div>`;

    return tabbed([["ov", "نظرة عامة"], ["rd", "تفاصيل الاستقالات"]],
      [["ov", ov], ["rd", plist("جدول الاستقالات", rs.length + " استقالة", cards, ["تسجيل استقالة", "resignation"])]], side);
  }

  // القطاعات
  function pageSectors() {
    const nid = state.node;
    const isRoot = nid === "root";
    const a = isRoot ? aggregateAll() : aggregate(nid);
    const kids = isRoot ? roots() : childrenOf(nid);
    const name = isRoot ? "الجهة كاملة" : (unitById(nid) || {}).name || "";
    const vac = a.approved - a.filled;

    const path = isRoot ? [] : pathOf(nid);
    const crumbs = `<div class="crumbs">
      ${isRoot ? '<span class="cur">الجهة كاملة</span>' : `<a onclick="APP.goNode('root')">الجهة كاملة</a><span class="sep">›</span>`}
      ${path.map((x, i) => (i === path.length - 1
        ? `<span class="cur">${esc((unitById(x) || {}).name)}</span>`
        : `<a onclick="APP.goNode('${x}')">${esc((unitById(x) || {}).name)}</a><span class="sep">›</span>`)).join("")}
    </div>`;

    const chips = `<div class="dchips">
      <div class="dchip">الوظائف المعتمدة<b>${a.approved}</b></div>
      <div class="dchip">المشغولة<b>${a.filled}</b></div>
      <div class="dchip">الشاغرة<b>${vac}</b></div>
      <div class="dchip">نسبة الإشغال<b>${pct(a.filled, a.approved)}٪</b></div></div>`;

    const charts = `<div class="d3">
      <div class="dbox"><div class="bt ttl-edit">الشواغر</div>${splitbar([["مشغولة", a.filled, "var(--g-700)"], ["شاغرة", vac, "var(--g-400)"]])}</div>
      <div class="dbox"><div class="bt ttl-edit">المستوى الوظيفي</div>${splitbar([["مبتدئ", a.junior, "var(--emerald)"], ["متقدم", a.senior, "var(--g-800)"]])}</div>
      <div class="dbox"><div class="bt ttl-edit">الجنس</div>${splitbar([["ذكور", a.male, "var(--g-600)"], ["إناث", a.female, "var(--gold)"]])}</div></div>`;

    let ch = "";
    if (kids.length) {
      const cardsHtml = kids.map((k) => {
        const s = aggregate(k.id);
        const sub = childrenOf(k.id).length;
        const editIc = canEdit() ? `<span class="iact" title="تعديل" onclick="event.stopPropagation();APP.openForm('unit','${k.id}')">${icon("pen")}</span>` : "";
        return `<div class="dcard" onclick="APP.goNode('${k.id}')">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div class="dn">${esc(k.name)}</div>${editIc}</div>
          <div class="dm"><span class="b">${s.filled}</span><span class="s">من ${s.approved} وظيفة معتمدة</span></div>
          <div class="dbar"><span style="width:${pct(s.filled, s.approved)}%"></span></div>
          <div class="dpct">إشغال ${pct(s.filled, s.approved)}٪ · شاغر ${s.approved - s.filled}${sub ? ` · ${sub} وحدات ↙` : ""}</div></div>`;
      }).join("");
      const addBtn = canEdit() ? `<button class="btn btn-p" onclick="APP.openForm('unit')">${icon("plus")} إضافة إدارة / قسم</button>` : "";
      ch = `<div style="margin-top:18px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:10px">
        <div class="bt ttl-edit" style="font-size:13.5px;color:var(--g-900);margin:0">الإدارات / الأقسام التابعة</div>${addBtn}</div>
        <div class="dgrid" style="margin-bottom:0">${cardsHtml}</div></div>`;
    }

    const sub = kids.length
      ? `<div class="dsub">يضم ${kids.length} إدارة/قسم · الإحصائيات مجمّعة على الكل</div>`
      : '<div class="dsub">وحدة تنظيمية نهائية</div>';

    return `<div class="mrow full"><div class="vhost"><div class="view show">
      ${crumbs}<div class="dhead"><h3>${esc(name)}</h3>${chips}</div>${sub}${charts}${ch}</div></div></div>`;
  }

  /* ---------------- غلاف التبويبات ---------------- */
  function tabbed(tabs, views, side) {
    const active = state.tab || tabs[0][0];
    const t = tabs.map(([k, l]) => `<div class="ptab ${k === active ? "on" : ""}" onclick="APP.setTab('${k}')">${esc(l)}</div>`).join("");
    const v = views.map(([k, html]) => `<div class="view ${k === active ? "show" : ""}" id="v-${k}">${html}</div>`).join("");
    return `<div class="ptabs">${t}</div>
      <div class="mrow${side ? "" : " full"}"><div class="vhost">${v}</div>
      ${side ? `<div class="panel side-panel">${side}</div>` : ""}</div>`;
  }

  function openForm(kind, id) {
    if (!canEdit()) return;
    const F = FORMS[kind];
    const row = id ? (db()[F.table] || []).find((r) => r.id === id) || {} : {};
    const fh = F.fields(row).map(([k, lbl, type, val, sel, full]) => {
      const inp = sel != null
        ? `<select class="inp" data-k="${k}">${sel}</select>`
        : `<input class="inp" data-k="${k}" type="${type}" value="${esc(val == null ? "" : val)}" placeholder="اكتب هنا…">`;
      return `<div class="fld2 ${full ? "full" : ""}"><label>${esc(lbl)}</label>${inp}</div>`;
    }).join("");

    const period = F.noPeriod ? "" : `
      <div class="fld2"><label>السنة</label><select class="inp" data-k="year">
        ${(CFG.YEARS || [2026]).map((y) => `<option value="${y}" ${Number(row.year || state.filters.year) === y ? "selected" : ""}>${y}</option>`).join("")}
      </select></div>
      <div class="fld2"><label>الشهر</label><select class="inp" data-k="month">
        ${MONTHS_FULL.map((m, i) => `<option value="${i + 1}" ${Number(row.month || new Date().getMonth() + 1) === i + 1 ? "selected" : ""}>${m}</option>`).join("")}
      </select></div>`;

    $("#formSheet").innerHTML = `
      <div class="sheet-h"><h3>${id ? "تعديل" : "إضافة"} — ${esc(F.title)}</h3>
        <button class="xbtn" onclick="APP.closeForm()">✕</button></div>
      <div class="sheet-b"><div class="frm">${fh}${period}</div></div>
      <div class="sheet-f"><button class="btn btn-p" onclick="APP.saveForm('${kind}','${id || ""}')">${icon("check")} حفظ</button>
        <button class="btn btn-x" onclick="APP.closeForm()">إلغاء</button></div>`;
    $("#formMask").classList.add("open");
  }

  async function saveForm(kind, id) {
    const F = FORMS[kind];
    const payload = {};
    $("#formSheet").querySelectorAll("[data-k]").forEach((el) => {
      let v = el.value;
      if (el.type === "number" || ["stage", "year", "month", "approved", "filled", "junior", "senior", "male", "female"].includes(el.dataset.k)) {
        v = v === "" ? null : Number(v);
      }
      payload[el.dataset.k] = v;
    });
    try {
      if (id) await DB.update(F.table, id, payload);
      else await DB.insert(F.table, payload);
      closeForm();
      render();
      toast(id ? "تم حفظ التعديلات" : "تمت الإضافة بنجاح");
    } catch (e) {
      alert("تعذّر الحفظ: " + e.message);
    }
  }

  async function removeRow(table, id) {
    if (!confirm("هل تريد حذف هذا السجل؟")) return;
    try { await DB.remove(table, id); render(); toast("تم الحذف"); }
    catch (e) { alert("تعذّر الحذف: " + e.message); }
  }

  const closeForm = () => $("#formMask") && $("#formMask").classList.remove("open");

  function toast(msg) {
    let t = $(".toast");
    if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  /* ---------------- تعديل العناوين ---------------- */
  function toggleEdit() {
    if (!canEditTitles()) return;
    state.edit = !state.edit;
    document.body.classList.toggle("edit", state.edit);
    document.querySelectorAll(".ttl-edit, .chead h1, .dhead h3").forEach((el) => {
      el.classList.toggle("editable", state.edit);
      el.contentEditable = state.edit ? "true" : "false";
    });
  }
  async function saveTitles() {
    const map = {};
    document.querySelectorAll(".ttl-edit").forEach((el) => { if (el.dataset.k) map[el.dataset.k] = el.textContent.trim(); });
    try {
      const rec = (db().settings || []).find((s) => s.key === "titles");
      if (rec) await DB.update("settings", rec.id, { value: JSON.stringify(map) });
      else await DB.insert("settings", { key: "titles", value: JSON.stringify(map) });
      toast("تم حفظ العناوين");
    } catch (e) { alert("تعذّر الحفظ: " + e.message); }
    toggleEdit();
  }
  function applyTitles() {
    let map = {};
    try { map = JSON.parse(((db().settings || []).find((s) => s.key === "titles") || {}).value || "{}"); } catch (e) {}
    document.querySelectorAll(".ttl-edit").forEach((el) => {
      const k = el.dataset.k;
      if (k && map[k]) el.textContent = map[k];
    });
  }

  const PAGES = {

    resignations: { title: "الاستقالات", render: pageResignations },
    sectors: { title: "القطاعات", render: pageSectors },
  };

  function readHash() {
    const h = (location.hash || "#/").replace(/^#\/?/, "").split("/")[0];
    state.page = PAGES[h] ? h : "index";
  }

  function render() {
    const P = PAGES[state.page];
    document.getElementById("app").innerHTML = shell(P.title, P.render());
    document.title = P.title + " · أداء";
    applyTitles();
    if (state.edit) { state.edit = false; toggleEdit(); }
  }

        <h2>متابعة إدارة استقطاب المواهب</h2>
        <p class="login-sub">${demo ? "أدخل اسمك ورمز الدخول" : "سجّل الدخول بحساب المركز"}</p>
        ${msg ? `<div class="login-err">${esc(msg)}</div>` : ""}
        ${demo ? `
          <div class="fld2 full"><label>الاسم</label>
            <input class="inp" id="dname" placeholder="مثال: أحمد الغانم" autocomplete="name"></div>
          <div class="fld2 full"><label>رمز الدخول</label>
            <input class="inp code-inp" id="dcode" type="tel" inputmode="numeric" maxlength="8"
              placeholder="••••" autocomplete="one-time-code"></div>
          <button class="btn btn-p login-btn" onclick="APP.demoLogin()">دخول</button>`
        : `
          <div class="fld2 full"><label>البريد الإلكتروني</label>
            <input class="inp" id="email" type="email" placeholder="name@adaa.gov.sa" autocomplete="username"></div>
          <div class="fld2 full"><label>كلمة المرور</label>
            <input class="inp" id="pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
          <button class="btn btn-p login-btn" onclick="APP.login()">تسجيل الدخول</button>`}
      </div></div>`;
    const first = document.getElementById(demo ? "dname" : "email");
    if (first) {
      first.focus();
      document.querySelectorAll(".login-card .inp").forEach((el) => {
        el.addEventListener("keydown", (e) => { if (e.key === "Enter") (demo ? APP.demoLogin() : APP.login()); });
      });
    }
  }

  /* ---------------- الواجهة العامة ---------------- */
  window.APP = {
    setTab(k) { state.tab = k; render(); },
    goNode(id) { state.node = id; render(); },
    setFilter(k, v) { state.filters[k] = k === "unit" ? v : Number(v); state.tab = state.tab; render(); },
    toggleEdit, saveTitles, openForm, saveForm, closeForm, removeRow,
    async demoLogin() {
      const name = document.getElementById("dname").value.trim();
      const code = document.getElementById("dcode").value.trim();
      if (!name) return loginScreen("فضلًا أدخل الاسم");
      if (!code) return loginScreen("فضلًا أدخل رمز الدخول");
      try { state.user = AUTH.demoSignIn(name, code); } catch (e) { return loginScreen(e.message); }
      await boot();
    },
    async login() {
      try {
        state.user = await AUTH.signIn(document.getElementById("email").value.trim(), document.getElementById("pass").value);
        await boot();
      } catch (e) { loginScreen(e.message); }
    },
    async logout() { await AUTH.signOut(); state.user = null; loginScreen(); },
  };

  async function boot() {
    try {
      await DB.loadAll();
      readHash();
      render();
    } catch (e) {
      loginScreen("تعذّر تحميل البيانات: " + e.message);
    }
  }

  window.addEventListener("hashchange", () => { if (state.user) { state.tab = null; readHash(); render(); } });

  (async function init() {
    state.user = await AUTH.current();
    if (state.user) await boot();
    else loginScreen();
  })();
})();
